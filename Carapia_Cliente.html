.chip .m2{opacity:.7;font-size:12px}
.catl{display:flex;align-items:center;gap:8px;margin:16px 2px 8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:hsl(var(--h,330) 55% var(--cat-edge))}
.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line)}.kv span{color:var(--mute)}.kv b{font-weight:600;text-align:right}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.fld>label{font-size:13px;color:var(--mute)}
.in{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;text-align:center;text-decoration:none}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.day{margin:16px 0 8px;font-size:14px;font-weight:600}
.ok{background:#eaf7f0;border-color:#bfe6d1}.no{background:#fdeeec;border-color:#f3c9c4}
</style></head><body><main id="app"></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pad=n=>String(n).padStart(2,'0');
const pd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const dm=s=>{const d=pd(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const hm=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const tm=s=>{const p=String(s||'0:0').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)};
const fm=m=>m<60?m+'min':Math.floor(m/60)+'h'+(m%60?pad(m%60):'');
const DS=['dom','seg','ter','qua','qui','sex','sáb'],DF=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const CAT={Unhas:330,Sobrancelhas:28,Cílios:268,Cabelo:200,Pele:150,Maquiagem:6,Outros:225};const cats=Object.keys(CAT);
const waLink=(z,t)=>{let d=String(z||'').replace(/\D/g,'');if(d.length<=11)d='55'+d;return 'https://wa.me/'+d+(t?'?text='+encodeURIComponent(t):'')};
function b64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return JSON.parse(new TextDecoder().decode(b))}
const IMSG='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.2 7.5L3 21l2-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>';

let MODE='',B='',D=null,DJ='',ERR=false,CS=[],CD='',CNM='',CZP='',SENT=null,BUSY=false,LK='cc-req';
function init(){
  const h=location.hash;
  try{
    if(h.indexOf('#f=')===0){const c=b64d(h.slice(3));B=c.u.replace(/\/+$/,'')+'/cs/'+encodeURIComponent(c.c);MODE='live';LK='cc-req-'+B}
    else if(h.indexOf('#cliente=')===0){D=b64d(h.slice(9));MODE='snap'}
  }catch(e){}
  if(MODE==='live'){try{SENT=JSON.parse(localStorage.getItem(LK))}catch(e){}load();chk()}
  render();
}
function load(){
  fetch(B+'/pub.json').then(r=>r.json()).then(d=>{
    ERR=!(d&&d.s&&d.f);const j=JSON.stringify(d);
    if(j!==DJ){DJ=j;D=ERR?null:d;if(!(document.activeElement&&document.activeElement.tagName==='INPUT'))render()}
  }).catch(()=>{ERR=true;if(!D)render()});
}
function chk(){
  if(!SENT||SENT.st!=='novo')return;
  fetch(B+'/req/'+SENT.id+'.json').then(r=>r.json()).then(r=>{if(r&&r.st&&r.st!==SENT.st){SENT.st=r.st;keep();if(!(document.activeElement&&document.activeElement.tagName==='INPUT'))render()}}).catch(()=>{});
}
const keep=()=>{try{localStorage.setItem(LK,JSON.stringify(SENT))}catch(e){}};
setInterval(()=>{if(MODE==='live'){load();chk()}},15000);

const sel=()=>CS.map(i=>D.s[i]).filter(Boolean);
function msgTxt(){
  const its=sel(),mn=its.reduce((a,x)=>a+x[2],0),vl=its.reduce((a,x)=>a+x[3],0),p=CD.split('|'),d=pd(p[0]);
  return 'Oi! Aqui é a '+CNM.trim()+'. Quero pedir um horário no '+D.n+':\n'+its.map(x=>'• '+x[0]).join('\n')+'\n'+DS[d.getDay()]+' '+dm(p[0])+' às '+hm(+p[1])+' ('+fm(mn)+' · '+R(vl)+').\nPode confirmar para mim?';
}
function ready(){return sel().length&&CD&&CNM.trim().length>1&&(MODE!=='live'||CZP.replace(/\D/g,'').length>=10)}
function tog(i){const k=CS.indexOf(i);k<0?CS.push(i):CS.splice(k,1);CD='';render()}
function pick(ds,t){CD=ds+'|'+t;render()}
function btn(){
  const e=$('cbt');if(!e)return;
  if(!ready()){e.innerHTML=`<button class="btn" disabled>${MODE==='live'?'Enviar pedido':IMSG+' Pedir pelo WhatsApp'}</button><p class="mu" style="margin-top:8px">${MODE==='live'?'Escolha o trabalho e o horário, e preencha seu nome e WhatsApp.':'Escolha o trabalho, o horário e digite seu nome.'}</p>`;return}
  if(MODE==='live')e.innerHTML=`<button class="btn" onclick="enviar()"${BUSY?' disabled':''}>${BUSY?'Enviando…':'Enviar pedido'}</button>`+(D.z?`<a class="btn sec" style="margin-top:8px" href="${waLink(D.z,msgTxt())}" target="_blank" rel="noopener">${IMSG} Prefiro chamar no WhatsApp</a>`:'');
  else e.innerHTML=D.z?`<a class="btn" href="${waLink(D.z,msgTxt())}" target="_blank" rel="noopener">${IMSG} Pedir pelo WhatsApp</a>`:`<button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(msgTxt())">Copiar pedido</button>`;
}
function enviar(){
  if(BUSY||!ready())return;BUSY=true;btn();
  const its=sel(),p=CD.split('|'),id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const r={id,nome:CNM.trim().slice(0,60),zap:CZP.trim().slice(0,20),sv:its.map(x=>x[0]),ds:p[0],t:hm(+p[1]),min:its.reduce((a,x)=>a+x[2],0),val:its.reduce((a,x)=>a+x[3],0),ts:Date.now(),st:'novo'};
  fetch(B+'/req/'+id+'.json',{method:'PUT',body:JSON.stringify(r)}).then(x=>{if(!x.ok)throw 0;SENT=r;keep();BUSY=false;CS=[];CD='';render();scrollTo(0,0)}).catch(()=>{BUSY=false;btn();alert('Não consegui enviar. Confira sua internet e tente de novo, ou chame a studio pelo WhatsApp.')});
}
function outro(){SENT=null;try{localStorage.removeItem(LK)}catch(e){}render()}
function status(){
  if(!SENT)return'';
  const d=pd(SENT.ds),q=DS[d.getDay()]+' '+dm(SENT.ds)+' às '+esc(SENT.t),w=esc(SENT.sv.join(' + '));
  if(SENT.st==='ok')return `<div class="card ok"><b>Horário confirmado ✓</b><p style="margin:6px 0 10px">${w}<br>${q}. Te esperamos!</p><button class="btn sec" onclick="outro()">Fazer outro pedido</button></div>`;
  if(SENT.st==='no')return `<div class="card no"><b>Esse horário não deu</b><p style="margin:6px 0 10px">${w} · ${q}. A studio não conseguiu esse horário. Escolha outro abaixo.</p><button class="btn sec" onclick="outro()">Escolher outro horário</button></div>`;
  return `<div class="card ok"><b>Pedido enviado ✓</b><p style="margin:6px 0 4px">${w}<br>${q}</p><p class="mu">Agora é só aguardar a confirmação da studio. Esta página mostra a resposta assim que ela chegar.</p></div>`;
}
function render(){
  const A=$('app');
  if(!MODE){A.innerHTML='<div class="logo-full"></div><div class="card" style="margin-top:16px"><b>Link incompleto</b><p class="mu" style="margin-top:6px">Peça para a studio enviar o link de agendamento de novo.</p></div>';return}
  if(!D){A.innerHTML=`<div class="logo-full"></div><div class="card" style="margin-top:16px"><b>${ERR?'A agenda ainda não está disponível':'Carregando…'}</b>${ERR?'<p class="mu" style="margin-top:6px">Chame a studio para combinar seu horário.</p>':''}</div>`;return}
  document.title=D.n;
  const blocked=SENT&&SENT.st!=='no'&&SENT.st!=='ok'?false:false;
  const its=sel(),need=its.reduce((a,x)=>a+x[2],0),tot=its.reduce((a,x)=>a+x[3],0);
  let h=`<div class="logo-full" role="img" aria-label="${esc(D.n)}"></div><div style="text-align:center;margin:0 0 18px"><h1>${esc(D.n)}</h1>${D.i?`<p class="mu" style="margin-top:6px">${esc(D.i)}</p>`:''}${D.e?`<p class="mu">${esc(D.e)}</p>`:''}</div>`;
  h+=status();
  h+=`<div class="card"><div class="cap">1 · o que você quer fazer?</div><p class="mu" style="margin:6px 0 2px">Toque em um ou mais trabalhos. Pode combinar, por exemplo mãos e pés.</p>`;
  if(!D.s.length)h+='<p class="mu">Os trabalhos ainda não foram cadastrados.</p>';
  cats.forEach(c=>{const l=D.s.map((x,i)=>[x,i]).filter(y=>y[0][1]===c);if(!l.length)return;
    h+=`<div class="catl" style="--h:${CAT[c]}"><i class="dot"></i><span class="cap" style="color:var(--mute)">${c}</span></div><div class="chips">${l.map(y=>`<button type="button" class="chip${CS.includes(y[1])?' on':''}" onclick="tog(${y[1]})">${esc(y[0][0])} <span class="m2">${fm(y[0][2])} · ${R(y[0][3])}</span></button>`).join('')}</div>`});
  if(its.length)h+=`<div class="kv" style="margin-top:14px"><span>Total</span><b class="num">${R(tot)} · ${fm(need)}</b></div>`;
  h+='</div><div class="card"><div class="cap">2 · escolha o dia e o horário</div>';
  if(!its.length)h+='<p class="mu" style="margin-top:8px">Escolha um trabalho acima para ver os horários que cabem.</p>';
  else{let any=false;
    Object.keys(D.f).sort().forEach(ds=>{const ts=[];D.f[ds].forEach(w=>{for(let t=w[0];t+need<=w[1];t+=D.p)ts.push(t)});if(!ts.length)return;any=true;const d=pd(ds);
      h+=`<div class="day">${DF[d.getDay()]}, ${dm(ds)}</div><div class="chips">${ts.map(t=>`<button type="button" class="chip mono${CD===ds+'|'+t?' on':''}" onclick="pick('${ds}',${t})">${hm(t)}</button>`).join('')}</div>`});
    if(!any)h+='<p class="mu" style="margin-top:8px">Não há horário livre para essa duração nos próximos dias. Chame a studio para combinar.</p>'}
  h+=`</div><div class="card"><div class="cap">3 · seus dados</div><div class="fld" style="margin-top:8px"><label for="cnm">Seu nome</label><input class="in" id="cnm" value="${esc(CNM)}" placeholder="como posso te chamar?" autocomplete="name" oninput="CNM=this.value;btn()"></div>`;
  if(MODE==='live')h+=`<div class="fld"><label for="czp">Seu WhatsApp (para a studio te responder)</label><input class="in" id="czp" type="tel" inputmode="tel" value="${esc(CZP)}" placeholder="(11) 90000-0000" autocomplete="tel" oninput="CZP=this.value;btn()"></div>`;
  h+=`<div id="cbt"></div><p class="mu" style="margin-top:10px">Isso é um pedido. O horário só fica seu quando a studio confirmar.</p></div><p class="mu" style="text-align:center">Horários atualizados em ${esc(String(D.t||'').slice(8,10))}/${esc(String(D.t||'').slice(5,7))} às ${esc(String(D.t||'').slice(11))}.</p>`;
  A.innerHTML=h;btn();
}
init();
</script></body></html>
